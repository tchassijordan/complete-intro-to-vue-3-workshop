<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar: The Last Airbender</title>
  </head>
  <body>
    <div id="app">
      <p v-if="characterList.length === 0">There are no characters</p>
      <ul v-else-if="characterList.length > 0">
        <li v-for="character in characterList">
          {{ character.name }}

          <button @click="addToFavorites(character.name)">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path d="M0 0h24v24H0z" fill="none" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11.074 2.633c.32-.844 1.531-.844 1.852 0l2.07 5.734a.99.99 0 0 0 .926.633h5.087c.94 0 1.35 1.17.611 1.743L18 14a.97.97 0 0 0-.322 1.092L19 20.695c.322.9-.72 1.673-1.508 1.119l-4.917-3.12a1 1 0 0 0-1.15 0l-4.917 3.12c-.787.554-1.83-.22-1.508-1.119l1.322-5.603A.97.97 0 0 0 6 14l-3.62-3.257C1.64 10.17 2.052 9 2.99 9h5.087a.99.99 0 0 0 .926-.633z"
              />
            </svg>
          </button>
        </li>
      </ul>
      <p>
        <span v-for="(character, index) in characterList"
          >{{ character.name }}{{ index === characterList.length - 1 ? '' : ', '
          }}
        </span>
      </p>
      <section v-if="favorites.length > 0">
        <p>Favorites</p>
        <ul>
          <li v-for="favorite in favorites">{{favorite}}</li>
        </ul>
      </section>
      <div>
        <fieldset>
          <label for="newName">Name:</label>
          <input name="newName" v-model="newName" />
        </fieldset>
        <button :disabled="!newName" @click="addNewName">Submit</button>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      Vue.createApp({
        data: () => ({
          characterList: [
            {
              name: "Aang",
            },
            {
              name: "Zuko",
            },
            {
              name: "Toph",
            },
            {
              name: "Katara",
            },
          ],
          favorites: [],
          newName: "",
        }),
        methods: {
          addToFavorites(name) {
            const newList = [...new Set([...this.favorites, name]).values()];
            this.favorites = newList;
          },
          addNewName() {
            if (!this.newName) {
              alert("You must provide a name");

              return;
            }

            if (this.characterList.some(({ name }) => name === this.newName)) {
              alert(`${this.newName} already in list`);

              return;
            }

            this.characterList = [
              ...this.characterList,
              { name: this.newName },
            ];
            this.newName = "";
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
